<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Dome — Conversational 3D Avatar Engine</title>
    <!-- Modern font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>
    <div class="glass-container">
        <header class="header-main">
            <div class="header-logo-title">
                <img src="/assets/logo.png" alt="Project Dome Logo" class="app-logo">
                <div class="header-titles">
                    <h1>PROJECT DOME</h1>
                    <p class="subtitle">Milimo Quantum • Google • Real-Time 3D Engine</p>
                </div>
            </div>
        </header>

        <!-- Canvas Container -->
        <div id="canvas-container">
            <div id="loading-overlay">
                <div class="spinner"></div>
                <p>Loading GNM Basis Buffers...</p>
            </div>
            <div id="stats-panel">
                <div>FPS: <span id="fps-val">--</span></div>
                <div>Render time: <span id="ms-val">--</span>ms</div>
                <div>Active blendshapes: <span id="active-val">0</span></div>
            </div>
        </div>

        <!-- Controls panel -->
        <div class="controls-panel">
            <!-- Test Speech section -->
            <div class="control-group">
                <h3>🗣️ Speech Interface</h3>
                <div class="speech-inputs">
                    <input type="text" id="speech-text" value="Hello world, welcome to Project Dome."
                        placeholder="Type speech text here...">
                    <button id="speak-btn">Speak</button>
                </div>
                <div class="audio-controls">
                    <button id="play-pause-btn" disabled>Play Audio</button>
                    <div id="audio-time">0.00s / 0.00s</div>
                </div>
                <!-- Speaking Style dropdown -->
                <div class="intensity-slider" style="margin-top: 14px;">
                    <label for="style-select">Speaking Style:</label>
                    <select id="style-select" style="flex: 1; padding: 8px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.12); outline: none;">
                        <option value="0">Style 0 (Dynamic/TA)</option>
                        <option value="1">Style 1</option>
                        <option value="2">Style 2</option>
                        <option value="3">Style 3</option>
                        <option value="4">Style 4</option>
                        <option value="5">Style 5</option>
                        <option value="6">Style 6</option>
                        <option value="7">Style 7</option>
                        <option value="8">Style 8</option>
                        <option value="9">Style 9</option>
                        <option value="10">Style 10</option>
                        <option value="11">Style 11 (Rigid)</option>
                    </select>
                </div>
            </div>

            <!-- Emotion selector -->
            <div class="control-group">
                <h3>🎭 Affective Overlay</h3>
                <div class="emotion-controls">
                    <select id="emotion-select">
                        <option value="">NEUTRAL</option>
                        <option value="HAPPY" selected>HAPPY</option>
                        <option value="SURPRISE">SURPRISE</option>
                        <option value="DISGUST">DISGUST</option>
                        <option value="SQUINT">SQUINT</option>
                        <option value="SAD">SAD</option>
                        <option value="SMILE_WIDE">SMILE WIDE</option>
                        <option value="PUCKER">PUCKER</option>
                        <option value="TONGUE_CENTER">TONGUE CENTER</option>
                    </select>
                    <div class="intensity-slider">
                        <label for="intensity-range">Intensity:</label>
                        <input type="range" id="intensity-range" min="0" max="1" step="0.1" value="1.0">
                        <span id="intensity-val">1.0</span>
                    </div>
                </div>
            </div>

            <!-- Head Pose & Eyeball Gaze Sliders -->
            <div class="control-group">
                <h3>👤 Head Pose & Gaze</h3>
                <div class="emotion-controls">
                    <div class="intensity-slider">
                        <label for="pose-yaw" style="min-width: 100px;">Neck Yaw:</label>
                        <input type="range" id="pose-yaw" min="-30" max="30" step="1" value="0">
                        <span id="yaw-val">0°</span>
                    </div>
                    <div class="intensity-slider">
                        <label for="pose-pitch" style="min-width: 100px;">Neck Pitch:</label>
                        <input type="range" id="pose-pitch" min="-20" max="20" step="1" value="0">
                        <span id="pitch-val">0°</span>
                    </div>
                    <div class="intensity-slider">
                        <label for="gaze-yaw" style="min-width: 100px;">Gaze Horiz:</label>
                        <input type="range" id="gaze-yaw" min="-25" max="25" step="1" value="0">
                        <span id="gaze-y-val">0°</span>
                    </div>
                    <div class="intensity-slider">
                        <label for="gaze-pitch" style="min-width: 100px;">Gaze Vert:</label>
                        <input type="range" id="gaze-pitch" min="-15" max="15" step="1" value="0">
                        <span id="gaze-p-val">0°</span>
                    </div>
                    <div class="intensity-slider" style="margin-top: 6px; border-top: 1px solid rgba(0,0,0,0.06); padding-top: 10px;">
                        <input type="checkbox" id="gaze-auto" checked style="width: 16px; height: 16px; margin-right: 8px; cursor: pointer;">
                        <label for="gaze-auto" style="cursor: pointer; font-size: 0.85rem; font-weight: 600;">Keep Eye Contact (Track Camera)</label>
                    </div>
                </div>
            </div>

            <!-- Identity (Character Customization) Sampler -->
            <div class="control-group">
                <h3>🧬 Character Identity</h3>
                <div class="emotion-controls">
                    <div class="intensity-slider">
                        <label for="id-gender" style="min-width: 100px;">Gender:</label>
                        <select id="id-gender" style="flex: 1; padding: 8px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.12); outline: none;">
                            <option value="0">Female</option>
                            <option value="1">Male</option>
                        </select>
                    </div>
                    <div class="intensity-slider">
                        <label for="id-ethnicity" style="min-width: 100px;">Ethnicity:</label>
                        <select id="id-ethnicity" style="flex: 1; padding: 8px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.12); outline: none;">
                            <option value="2">White</option>
                            <option value="1">Asian</option>
                            <option value="3">Black</option>
                            <option value="0">Middle Eastern</option>
                        </select>
                    </div>
                    <button id="random-id-btn" style="width: 100%; margin-top: 6px; background-color: var(--google-green); box-shadow: 0 2px 6px rgba(52, 168, 83, 0.15);">Generate Identity</button>
                    <div id="identity-pca-sliders" style="margin-top: 12px; border-top: 1px solid rgba(0,0,0,0.06); padding-top: 10px;">
                        <details>
                            <summary style="cursor: pointer; font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px;">PCA Components (Fine-Tune)</summary>
                            <div id="pca-sliders-container"></div>
                        </details>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Engine scripts -->
    <script src="audio_sync.js"></script>
    <script src="animation_controller.js"></script>
    <script src="renderer.js"></script>
</body>

</html>
